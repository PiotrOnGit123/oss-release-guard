name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local package
        run: python -m pip install .
      - name: Compile Python sources
        run: python -m compileall oss_release_guard tests scripts
      - name: Run repository quality gate
        run: python scripts/check_quality.py
      - name: Run checksum, archive policy and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed command
        run: oss-release-guard --version
      - name: Exercise maintainer workflow commands
        run: |
          oss-release-guard triage-issue examples/issue-security.json --format json
          oss-release-guard review-checklist examples/pr-review.json
          oss-release-guard release-readiness examples/release-manifest.json
          oss-release-guard release-notes examples/release-changes.json
