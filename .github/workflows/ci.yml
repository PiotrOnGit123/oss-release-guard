name: Tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local package
        run: python -m pip install . "tomli==2.5.0; python_version < '3.11'"
      - name: Compile Python sources
        run: python -m compileall oss_release_guard tests scripts
      - name: Run repository quality gate
        run: python scripts/check_quality.py
      - name: Run checksum, archive policy and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed command
        run: oss-release-guard --version
      - name: Exercise maintainer workflow commands
        run: |
          oss-release-guard triage-issue examples/issue-security.json --format json
          oss-release-guard review-checklist examples/pr-review.json
          oss-release-guard release-readiness examples/release-manifest.json
          oss-release-guard release-notes examples/release-changes.json
  quality:
    name: Lint, Security, Coverage and Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reviewed development tools
        run: python -m pip install -r requirements-dev.txt .
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Scan runtime Python code for security issues
        run: bandit -r oss_release_guard -ll
      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt --strict
      - name: Test with subprocess and branch coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage combine
          coverage report
      - name: Verify committed example outputs
        run: python scripts/check_examples.py
      - name: Build and validate distributions
        run: |
          python -m build
          twine check --strict dist/*.whl dist/*.tar.gz
          python scripts/verify_dist.py
