name: Verified Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml, scripts/publish_release.py]
permissions:
  contents: read
concurrency:
  group: verified-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-v0.2.0]')
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install reviewed build tools
        run: python -m pip install -r requirements-dev.txt .
      - name: Build and audit release assets
        run: |
          python -m build
          twine check --strict dist/*.whl dist/*.tar.gz
          python scripts/verify_dist.py
      - name: Smoke-test installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-smoke/bin/oss-release-guard" --version
          "$RUNNER_TEMP/release-smoke/bin/oss-release-guard" triage-issue "$GITHUB_WORKSPACE/examples/issue-security.json" --format json
          "$RUNNER_TEMP/release-smoke/bin/oss-release-guard" review-checklist "$GITHUB_WORKSPACE/examples/pr-review.json"
          "$RUNNER_TEMP/release-smoke/bin/oss-release-guard" release-readiness "$GITHUB_WORKSPACE/examples/release-manifest.json"
          "$RUNNER_TEMP/release-smoke/bin/oss-release-guard" release-notes "$GITHUB_WORKSPACE/examples/release-changes.json"
      - name: Publish release and complete milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
