name: Feature request
description: Describe a concrete open-source maintainer workflow.
labels: ["triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Maintainer problem
      description: Explain the workflow and why the existing checks are insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Maintainer workflow area
      options:
        - Issue triage
        - Pull request review
        - Release management
        - Security hardening
        - Quality gate
        - Documentation
    validations:
      required: true
