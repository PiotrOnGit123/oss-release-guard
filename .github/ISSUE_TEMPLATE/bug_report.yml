name: Bug report
description: Report an incorrect result or failure using a minimal reproducer.
labels: ["bug", "triage"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include Python/OS versions and a synthetic archive. Do not upload secrets or unpublished releases.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Sanitized JSON report
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Maintainer safety checks
      options:
        - label: This report does not include credentials, private source archives, or exploit payloads.
          required: true
