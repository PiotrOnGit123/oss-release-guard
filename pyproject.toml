[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-release-guard"
version = "0.2.0"
description = "Release readiness, triage, and archive policy checks for open-source maintainers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PiotrOnGit123"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
oss-release-guard = "oss_release_guard.__main__:main"

[project.urls]
Repository = "https://github.com/PiotrOnGit123/oss-release-guard"
Issues = "https://github.com/PiotrOnGit123/oss-release-guard/issues"
Changelog = "https://github.com/PiotrOnGit123/oss-release-guard/blob/main/CHANGELOG.md"
Security = "https://github.com/PiotrOnGit123/oss-release-guard/security/policy"

[tool.setuptools.packages.find]
include = ["oss_release_guard*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["oss_release_guard"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 85
